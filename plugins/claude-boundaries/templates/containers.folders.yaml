# Container map — the machine-readable source of truth for this repo's
# architecture. Copy to `.wiki/containers.yaml` (or `boundaries.yaml` at the
# repo root) and edit.
#
#   node <plugin>/scripts/boundaries.mjs validate    <- after every edit
#   node <plugin>/scripts/boundaries.mjs check
#
# Delete the file to opt out entirely: every hook in this plugin is a silent
# no-op in a project with no map.
#
# This schema is a superset of claude-architect's `.wiki/containers.yaml`. If
# you use both plugins, one file serves both.

version: 1

# Ordered TOP-DOWN. Dependency direction runs downward through this list: a
# container may consume its own layer (if `intra_layer` allows) or any layer
# below it, never above. Getting the order backwards makes every legal edge
# look like a violation, so read it once more before you run `validate`.
layers:
  - id: user
    intra_layer: none        # none | declared
    role: Entry points — HTTP handlers, CLI commands, queue consumers, cron jobs.
  - id: orchestration
    intra_layer: declared    # same-layer edges legal only where `consumes` lists them
    role: Business logic, grouped by capability. Owns transaction boundaries.
  - id: engine
    intra_layer: none        # an engine container needing another means orchestration should sequence them
    role: Operations against 3rd-party systems — DB, HTTP, auth, storage.
    # Third-party imports allowed in this layer: none | any | [a list].
    # `any` is the default and the right answer for a layer whose job is to
    # wrap somebody else's SDK.
    external: any

policy:
  topology: folders          # folders | packages
  root: src                  # repo-relative source root
  skip_layers: false         # false: user may not reach engine directly
  public_surface: [index.ts] # the only importable file(s) in a container
  language: typescript       # typescript | javascript | python

  # Sub-paths inside a container that may import nothing outside themselves —
  # not even the rest of their own container. This is the purity boundary that
  # keeps business rules separable from I/O sequencing. Without it the
  # orchestration layer merges the application and domain roles, and you can no
  # longer unit-test a rule without stubbing an engine call. External packages
  # are unaffected; only in-repo imports are checked.
  pure_paths: [domain]

  # `import type` is a dependency like any other. TypeScript erases it at
  # runtime, which is exactly why it gets waved through in review — the coupling
  # is real, the emitted JS just doesn't show it. Set `ignore` to opt out.
  type_imports: edge

  # Files exempt from the third-party import rule only. The edge rules still
  # apply to them, which is what keeps a test from importing a forbidden
  # container to get at its internals.
  test_exempt: ["**/*.test.*", "**/*.spec.*"]

containers:
  # ---- user ---------------------------------------------------------------
  - id: user/http-api
    path: src/user/http-api
    slice: null                # user containers usually fan out across slices
    owns: REST surface, request validation, response shaping.
    consumes:
      - orchestration/auth
      - orchestration/permissions

  # ---- orchestration ------------------------------------------------------
  - id: orchestration/auth
    path: src/orchestration/auth
    slice: auth                # aligns with engine/... containers of the same slice
    owns: Session lifecycle, credential verification, MFA policy.
    consumes:
      - orchestration/permissions
      - engine/identity-db
      - engine/token
    agent:
      # Optional per-container spawn tuning for claude-architect. Ignored here.
      effort: high
      notes: Invariant-dense. Rules belong in domain/ and must stay import-free.

  - id: orchestration/permissions
    path: src/orchestration/permissions
    slice: permissions
    owns: Role and grant evaluation.
    consumes:
      - engine/identity-db

  # ---- engine -------------------------------------------------------------
  - id: engine/identity-db
    path: src/engine/identity-db
    shared: true               # serves several slices; belongs to none
    external: [pg]             # overrides the layer default
    owns: CRUD against the identity schema. Returns engine DTOs, never domain models.
    consumes: []

  - id: engine/token
    path: src/engine/token
    slice: auth
    external: [jsonwebtoken]
    owns: JWT signing and verification.
    consumes: []
